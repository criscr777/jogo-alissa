<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Alissa ❤️</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Georgia,serif;background:radial-gradient(circle at top,#302044,#090713 70%);color:#fff;padding:32px 16px}.wrap{width:min(900px,100%);margin:auto}.hero{text-align:center;margin-bottom:28px}.hero h1{font-size:clamp(2rem,6vw,4rem);margin:.2em 0;color:#ffd7ee}.hero p{color:#d8c9da}.letter{background:#fffaf2;color:#332735;border-radius:6px;padding:clamp(28px,6vw,64px);box-shadow:0 25px 70px #0008;position:relative;line-height:1.8;font-size:clamp(1rem,2vw,1.15rem)}.letter:before{content:'♥';position:absolute;right:28px;top:18px;color:#d66b9e;font-size:28px}.letter h2{font-family:Georgia,serif;text-align:center;color:#9c476f}.letter-text{white-space:pre-line}.media{margin-top:34px}.media h2{text-align:center}.video-box,.photos{background:#11101b;border:1px solid #ffffff22;border-radius:18px;padding:16px;margin-top:16px}.video-box video{width:100%;display:block;border-radius:12px;max-height:600px}.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.photos img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px}.hint{text-align:center;color:#aaa;font:14px Arial,sans-serif;margin-top:12px}.back{display:block;width:max-content;margin:28px auto 0;color:#ffd7ee;text-decoration:none;font:600 14px Arial,sans-serif}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero"><div>🌊 ✨</div><h1>Para você, Alissa</h1><p>A história acabou. Mas essa parte é só nossa.</p></header>
    <article class="letter">
      <h2>Uma carta para você</h2>
      <div class="letter-text">[COLOQUE AQUI O TEXTO DA CARTA QUE VOCÊ ESCREVEU PARA ELA]</div>
    </article>
    <section class="media">
      <h2>Algumas lembranças nossas ❤️</h2>
      <div class="video-box"><video controls playsinline preload="metadata"><source src="video.mp4" type="video/mp4">Seu navegador não conseguiu carregar o vídeo.</video><div class="hint">Coloque seu vídeo em <b>public/video.mp4</b>.</div></div>
      <div class="photos">
        <img src="foto1.jpg" alt="Foto nossa 1"><img src="foto2.jpg" alt="Foto nossa 2"><img src="foto3.jpg" alt="Foto nossa 3"><img src="foto4.jpg" alt="Foto nossa 4">
      </div>
      <div class="hint">Coloque as fotos em <b>public/foto1.jpg</b> até <b>public/foto4.jpg</b>.</div>
    </section>
    <a class="back" href="/">Voltar ao início</a>
  </main>
</body>
</html>
